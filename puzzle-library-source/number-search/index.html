<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Search - 6x9 Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <!-- Pre-loading Google Fonts for UI Preview -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto&family=Open+Sans&family=Lato&family=Montserrat&family=Oswald&family=Raleway&family=Merriweather&family=Playfair+Display&family=Lora&family=Nunito&family=Titillium+Web&family=Ubuntu&family=Poppins&family=Karla&family=Inconsolata&family=Droid+Sans&family=Droid+Serif&family=Arvo&family=Fjalla+One&family=Anton&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f6f8; padding: 20px; display: flex; flex-direction: column; align-items: center; color: #333; }
        h1 { color: #2c3e50; margin-bottom: 20px; }
        
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 1000px; display: flex; gap: 30px; }
        .left-col { flex: 2; display: flex; flex-direction: column; gap: 20px; }
        .right-col { flex: 1; display: flex; flex-direction: column; gap: 20px; }
        
        textarea { width: 100%; height: 80px; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-family: monospace; font-size: 0.9em; resize: vertical; background: #fafafa; }
        
        .control-group { background: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid #e9ecef; }
        .control-group h3 { margin-top: 0; margin-bottom: 10px; font-size: 1rem; color: #555; border-bottom: 2px solid #ddd; padding-bottom: 5px; }
        
        .row { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; }
        .row label { font-size: 0.85em; font-weight: 600; min-width: 110px; }
        .row input, .row select { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        
        button { padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; color: white; transition: 0.2s; width: 100%; font-size: 1rem; }
        .btn-gen { background: #3498db; }
        .btn-gen:hover { background: #2980b9; }
        
        .btn-down { background: #e74c3c; padding: 15px; font-size: 1.1em; margin-top: auto; }
        .btn-down:hover { background: #c0392b; }
        .btn-down:disabled { background: #95a5a6; cursor: not-allowed; }

        .dir-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; background: #eee; padding: 10px; border-radius: 6px; }
        .dir-cell { display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; padding: 8px; background: #fff; border: 1px solid #ddd; border-radius: 4px; transition: 0.1s; }
        .dir-cell:hover { background: #f0f0f0; }
        .dir-cell input { transform: scale(1.3); margin-top: 5px; cursor: pointer; }
        
        #status { text-align: center; color: #27ae60; font-weight: bold; margin-top: 10px; min-height: 20px; }

        /* Font Preview Styles in Dropdown */
        option[value="Roboto"] { font-family: 'Roboto', sans-serif; }
        option[value="Open Sans"] { font-family: 'Open Sans', sans-serif; }
        option[value="Lora"] { font-family: 'Lora', serif; }
    </style>
</head>
<body>

    <h1>Générateur Mots Mêlés (Format 6x9)</h1>

    <div class="container">
        <!-- LEFT COLUMN: SETTINGS -->
        <div class="left-col">
            
            <!-- 1. DATA GENERATION -->
            <div class="control-group">
                <h3>1. Configuration du Jeu</h3>
                <div class="row">
                    <label>Nb. Pages:</label>
                    <input type="number" id="totalPages" value="1" min="1" max="50">
                </div>
                <div class="row">
                    <label>Mots/Page:</label>
                    <input type="number" id="perPage" value="80" placeholder="80">
                </div>
                <div class="row">
                    <label>Chiffres:</label>
                    <select id="autoLen">
                        <option value="4">4 chiffres</option>
                        <option value="5" selected>5 chiffres</option>
                        <option value="6">6 chiffres</option>
                        <option value="7">7 chiffres</option>
                    </select>
                </div>
                <button class="btn-gen" onclick="genRandom()">Générer les Nombres Uniques</button>
            </div>

            <!-- 2. PDF STYLING -->
            <div class="control-group">
                <h3>2. Style PDF</h3>
                <div class="row">
                    <label>Police:</label>
                    <select id="fontSelect">
                        <optgroup label="Sans Serif">
                            <option value="Helvetica">Helvetica (Standard)</option>
                            <option value="Roboto">Roboto</option>
                            <option value="Open Sans">Open Sans</option>
                            <option value="Lato">Lato</option>
                            <option value="Montserrat">Montserrat</option>
                            <option value="Raleway">Raleway</option>
                            <option value="Nunito">Nunito</option>
                            <option value="Poppins">Poppins</option>
                        </optgroup>
                        <optgroup label="Serif">
                            <option value="Times">Times New Roman (Standard)</option>
                            <option value="Merriweather">Merriweather</option>
                            <option value="Playfair Display">Playfair Display</option>
                            <option value="Lora">Lora</option>
                            <option value="Droid Serif">Droid Serif</option>
                            <option value="Arvo">Arvo</option>
                        </optgroup>
                        <optgroup label="Monospace / Display">
                            <option value="Courier">Courier (Standard)</option>
                            <option value="Inconsolata">Inconsolata</option>
                            <option value="Oswald">Oswald</option>
                            <option value="Titillium Web">Titillium Web</option>
                            <option value="Ubuntu">Ubuntu</option>
                            <option value="Fjalla One">Fjalla One</option>
                            <option value="Anton">Anton</option>
                        </optgroup>
                    </select>
                </div>
                <div class="row">
                    <label>Taille Font (%):</label>
                    <input type="number" id="fontPercent" value="75" min="10" max="100" title="Pourcentage de la taille de la case">
                </div>
                <div class="row">
                    <label>Ép. Ligne Rectangle:</label>
                    <input type="number" id="lineWidth" value="0.5" step="0.1" min="0.1">
                </div>
                <div class="row">
                    <label>Ép. Ligne Solution:</label>
                    <input type="number" id="solWidth" value="0.5" step="0.1" min="0.1">
                </div>
                <div class="row">
                    <label>Taille Liste (pt):</label>
                    <input type="number" id="listSize" value="10" min="6">
                </div>
            </div>

            <div class="control-group">
                <h3>Données Brutes</h3>
                <textarea id="numbersInput" placeholder="Les nombres générés apparaîtront ici..."></textarea>
            </div>
        </div>

        <!-- RIGHT COLUMN: GRID & EXPORT -->
        <div class="right-col">
            <div class="control-group">
                <h3>3. Grille & Directions</h3>
                <div class="row">
                    <label>Taille Grille:</label>
                    <input type="number" id="gridSize" value="15" placeholder="15">
                </div>
                <label style="font-weight:bold; display:block; margin-bottom:5px;">Directions autorisées:</label>
                <div class="dir-grid">
                    <div class="dir-cell">↖<input type="checkbox" class="dir-cb" value="-1,-1"></div>
                    <div class="dir-cell">⬆<input type="checkbox" class="dir-cb" value="-1,0" checked></div>
                    <div class="dir-cell">↗<input type="checkbox" class="dir-cb" value="-1,1"></div>
                    <div class="dir-cell">⬅<input type="checkbox" class="dir-cb" value="0,-1" checked></div>
                    <div class="dir-cell" style="justify-content:center; color:#888;"><i class="fas fa-arrows-alt"></i></div>
                    <div class="dir-cell">➡<input type="checkbox" class="dir-cb" value="0,1" checked></div>
                    <div class="dir-cell">↙<input type="checkbox" class="dir-cb" value="1,-1"></div>
                    <div class="dir-cell">⬇<input type="checkbox" class="dir-cb" value="1,0" checked></div>
                    <div class="dir-cell">↘<input type="checkbox" class="dir-cb" value="1,1"></div>
                </div>
            </div>
            
            <button id="btnPdf" class="btn-down" onclick="makePDF()">
                <i class="fas fa-file-pdf"></i> TÉLÉCHARGER PDF (6x9)
            </button>
            <div id="status"></div>
            
            <p style="font-size:0.85em; color:#666; background:#fff; padding:10px; border-radius:4px; border:1px solid #ddd;">
                <i class="fas fa-info-circle"></i> <strong>Note:</strong> Le format de sortie est maintenant 6x9 pouces (15.24 x 22.86 cm) pour livres de poche.
            </p>
        </div>
    </div>

    <script>
        // MAPPING GOOGLE FONTS TO STANDARD PDF FONTS
        const fontMapping = {
            'Helvetica': 'helvetica', 'Roboto': 'helvetica', 'Open Sans': 'helvetica', 'Lato': 'helvetica', 
            'Montserrat': 'helvetica', 'Raleway': 'helvetica', 'Nunito': 'helvetica', 'Poppins': 'helvetica',
            'Titillium Web': 'helvetica', 'Ubuntu': 'helvetica', 'Karla': 'helvetica',
            
            'Times': 'times', 'Merriweather': 'times', 'Playfair Display': 'times', 'Lora': 'times', 
            'Droid Serif': 'times', 'Arvo': 'times',
            
            'Courier': 'courier', 'Inconsolata': 'courier', 'Oswald': 'courier', 'Fjalla One': 'courier', 'Anton': 'courier'
        };

        window.onload = function() {
            genRandom();
        };

        function genRandom() {
            const pages = parseInt(document.getElementById('totalPages').value) || 1;
            const perPage = parseInt(document.getElementById('perPage').value) || 80;
            const len = parseInt(document.getElementById('autoLen').value);
            
            const totalNeeded = pages * perPage;
            
            const min = Math.pow(10, len-1);
            const max = Math.pow(10, len)-1;
            const range = max - min + 1;

            if (totalNeeded > range) {
                alert(`Impossible de générer ${totalNeeded} nombres uniques. Le maximum pour ${len} chiffres est ${range}.`);
                return;
            }

            let uniqueSet = new Set();
            while(uniqueSet.size < totalNeeded) {
                let num = Math.floor(Math.random() * (max - min + 1)) + min;
                uniqueSet.add(num);
            }

            let arr = Array.from(uniqueSet);
            arr.sort(() => Math.random() - 0.5);

            document.getElementById('numbersInput').value = arr.join(', ');
            document.getElementById('status').textContent = `${arr.length} nombres générés pour ${pages} pages.`;
        }

        async function makePDF() {
            const { jsPDF } = window.jspdf;
            const status = document.getElementById('status');
            const btn = document.getElementById('btnPdf');

            let raw = document.getElementById('numbersInput').value;
            let allNums = raw.split(/[\s,]+/).filter(n => /^\d+$/.test(n));
            allNums = [...new Set(allNums)];

            const totalPages = parseInt(document.getElementById('totalPages').value) || 1;
            const gridSize = parseInt(document.getElementById('gridSize').value);
            const perPage = parseInt(document.getElementById('perPage').value);
            
            // PDF Styling Params
            const fontChoice = document.getElementById('fontSelect').value;
            const pdfFont = fontMapping[fontChoice] || 'helvetica';
            const fontScale = parseInt(document.getElementById('fontPercent').value) / 100;
            
            const gridLineWidth = parseFloat(document.getElementById('lineWidth').value);
            const solLineWidth = parseFloat(document.getElementById('solWidth').value);
            
            const listFontSize = parseInt(document.getElementById('listSize').value);

            let dirs = [];
            document.querySelectorAll('.dir-cb').forEach(cb => { if(cb.checked) dirs.push(cb.value.split(',').map(Number)); });
            if(dirs.length === 0) { alert("Cochez au moins une direction"); return; }
            if(allNums.length < perPage) { alert("Pas assez de nombres pour remplir une page !"); return; }

            btn.disabled = true;
            status.textContent = "Génération du PDF...";

            // --- CONFIGURATION 6x9 POUCES ---
            // 6 inches = 152.4 mm
            // 9 inches = 228.6 mm
            const doc = new jsPDF({ unit: 'mm', format: [152.4, 228.6] });
            
            // Récupération dynamique de la largeur (devrait être 152.4)
            const pageWidth = doc.internal.pageSize.getWidth();
            
            // Marges réduites pour le format 6x9 (12.7mm = 0.5 inch, standard KDP)
            const margin = 12.7; 
            const availableW = pageWidth - margin*2;
            const cellSize = availableW / gridSize;
            
            // On commence plus haut car la page est moins haute
            const startY = 25; 
            // --------------------------------

            let chunks = [];
            for(let i=0; i<allNums.length; i+=perPage) {
                chunks.push(allNums.slice(i, i+perPage));
            }
            chunks = chunks.slice(0, totalPages);

            for(let i=0; i<chunks.length; i++) {
                let grid = Array(gridSize).fill().map(()=>Array(gridSize).fill(null));
                let solutions = [];
                let current = chunks[i].sort((a,b)=>b.length - a.length);
                let placed = [];

                // Place Numbers
                for(let num of current) {
                    if(num.length > gridSize) continue;
                    let done = false, tries = 0;
                    while(!done && tries < 500) {
                        const d = dirs[Math.floor(Math.random()*dirs.length)];
                        const r = Math.floor(Math.random()*gridSize);
                        const c = Math.floor(Math.random()*gridSize);
                        
                        let fit = true;
                        for(let k=0; k<num.length; k++) {
                            let nr=r+d[0]*k, nc=c+d[1]*k;
                            if(nr<0||nr>=gridSize||nc<0||nc>=gridSize||(grid[nr][nc]!==null&&grid[nr][nc]!==num[k])) { fit=false; break; }
                        }

                        if(fit) {
                            for(let k=0; k<num.length; k++) grid[r+d[0]*k][c+d[1]*k] = num[k];
                            solutions.push({ 
                                r1:r, c1:c, 
                                r2:r+d[0]*(num.length-1), c2:c+d[1]*(num.length-1) 
                            });
                            placed.push(num);
                            done = true;
                        }
                        tries++;
                    }
                }
                
                // Fill Empty
                for(let r=0; r<gridSize; r++) for(let c=0; c<gridSize; c++) if(!grid[r][c]) grid[r][c] = Math.floor(Math.random()*10).toString();

                // --- PAGE JEU ---
                if(i>0) doc.addPage([152.4, 228.6]);
                
                drawPage(doc, grid, gridSize, cellSize, margin, startY, false, [], pdfFont, fontScale, gridLineWidth, solLineWidth);
                drawList(doc, placed, margin, startY + gridSize*cellSize + 8, availableW, pdfFont, listFontSize);

                // --- PAGE SOLUTION ---
                doc.addPage([152.4, 228.6]);
                
                drawPage(doc, grid, gridSize, cellSize, margin, startY, true, solutions, pdfFont, fontScale, gridLineWidth, solLineWidth);
                drawList(doc, placed, margin, startY + gridSize*cellSize + 8, availableW, pdfFont, listFontSize);
                
                await new Promise(r=>setTimeout(r,0));
            }

            doc.save('MotsMeles_6x9.pdf');
            status.textContent = "Téléchargement terminé !";
            btn.disabled = false;
        }

        function drawPage(doc, grid, size, cellSize, startX, startY, isSol, sols, fontName, fontScale, gridWidth, solWidth) {
            // 1. DESSINER LA GRILLE (RECTANGLES)
            doc.setDrawColor(0); 
            doc.setLineWidth(gridWidth); 
            
            for(let r=0; r<size; r++) {
                for(let c=0; c<size; c++) {
                    doc.rect(startX + c*cellSize, startY + r*cellSize, cellSize, cellSize);
                }
            }

            // 2. DESSINER LES CAPSULES DE SOLUTION
            if(isSol && sols) {
                doc.setFillColor(255, 255, 255); 
                doc.setDrawColor(60, 60, 60); 
                doc.setLineWidth(solWidth); 
                
                const radius = (cellSize / 2) * 0.82; 
                const k = 0.55228475;
                const stretch = cellSize * 0.25; 

                sols.forEach(sol => {
                    let x1 = startX + sol.c1 * cellSize + cellSize/2;
                    let y1 = startY + sol.r1 * cellSize + cellSize/2;
                    let x2 = startX + sol.c2 * cellSize + cellSize/2;
                    let y2 = startY + sol.r2 * cellSize + cellSize/2;

                    let dx = x2 - x1, dy = y2 - y1;
                    let angle = Math.atan2(dy, dx);
                    let ux = Math.cos(angle), uy = Math.sin(angle);
                    
                    x1 -= ux * stretch;
                    y1 -= uy * stretch;
                    x2 += ux * stretch;
                    y2 += uy * stretch;

                    let nx = -Math.sin(angle), ny = Math.cos(angle);

                    let p1x = x1 + nx*radius, p1y = y1 + ny*radius;
                    let p4x = x1 - nx*radius, p4y = y1 - ny*radius;
                    let p2x = x2 + nx*radius, p2y = y2 + ny*radius;
                    let p3x = x2 - nx*radius, p3y = y2 - ny*radius;

                    let c1x = p2x + ux*(radius*k), c1y = p2y + uy*(radius*k);
                    let c2x = p3x + ux*(radius*k), c2y = p3y + uy*(radius*k);
                    let c3x = p4x - ux*(radius*k), c3y = p4y - uy*(radius*k);
                    let c4x = p1x - ux*(radius*k), c4y = p1y - uy*(radius*k);

                    doc.moveTo(p1x, p1y);
                    doc.lineTo(p2x, p2y);
                    doc.curveTo(c1x, c1y, c2x, c2y, p3x, p3y);
                    doc.lineTo(p4x, p4y);
                    doc.curveTo(c3x, c3y, c4x, c4y, p1x, p1y);
                    doc.fillStroke();
                });
            }

            // 3. DESSINER LES NOMBRES
            doc.setTextColor(0);
            doc.setFont(fontName, "normal"); 
            
            const baseFontSize = (cellSize * 2.5) * fontScale; 
            doc.setFontSize(baseFontSize);

            for(let r=0; r<size; r++) {
                for(let c=0; c<size; c++) {
                    let x = startX + c*cellSize;
                    let y = startY + r*cellSize;
                    doc.text(grid[r][c], x+cellSize/2, y+cellSize/1.4, {align:'center'});
                }
            }
        }

        function drawList(doc, list, x, y, w, fontName, fontSizePts) {
            doc.setFont(fontName, "normal"); 
            doc.setFontSize(fontSizePts); 
            doc.setTextColor(60);
            
            let cols=4, cw=w/cols;
            
            list.forEach((n,i) => {
                doc.text(n, x + (i%cols)*cw + cw/2, y + Math.floor(i/cols)*(fontSizePts/2 + 2), {align:'center'});
            });
        }
    </script>
</body>
</html>
