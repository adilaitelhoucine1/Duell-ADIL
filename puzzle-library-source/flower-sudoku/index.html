<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flower Sudoku</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
    <div class="main-container">
        <header>
            <h1>Flower Sudoku</h1>
            <div class="controls">
                <div class="control-group">
                    <label for="language">Language:</label>
                    <select id="language">
                        <option value="en">English</option>
                        <option value="de">Deutsch</option>
                        <option value="fr">Français</option>
                        <option value="it">Italiano</option>
                    </select>
                </div>
                <div class="control-group">
                    <label for="difficulty">Difficulty:</label>
                    <select id="difficulty">
                        <option value="easy">Easy</option>
                        <option value="medium" selected>Medium</option>
                        <option value="hard">Hard</option>
                    </select>
                </div>
                <button id="new-game-btn">New Game</button>
                <button id="check-btn">Check</button>
                <button id="solve-btn" class="solve-btn">Solve</button>
                <div class="pdf-controls">
                    <label for="pdf-count">Puzzles:</label>
                    <input type="number" id="pdf-count" value="1" min="1" max="10">
                    <label style="font-size: 0.9em; margin: 0 5px;"><input type="checkbox" id="pdf-hide-title" checked> Hide Title</label>
                    <button id="pdf-btn" class="pdf-btn">Export</button>
                    <span id="pdf-status"></span>
                </div>
            </div>
            <div id="message-area" class="message-area"></div>
        </header>

        <div class="game-content">
            <div id="loading" class="loading hidden">Generating...</div>
            <div id="flower-grid" class="flower-grid">
                <!-- 15x15 Grid will be generated here -->
            </div>
            
            <div class="numpad">
                <button class="num-btn" data-val="1">1</button>
                <button class="num-btn" data-val="2">2</button>
                <button class="num-btn" data-val="3">3</button>
                <button class="num-btn" data-val="4">4</button>
                <button class="num-btn" data-val="5">5</button>
                <button class="num-btn" data-val="6">6</button>
                <button class="num-btn" data-val="7">7</button>
                <button class="num-btn" data-val="8">8</button>
                <button class="num-btn" data-val="9">9</button>
                <button class="num-btn action-btn text-btn" data-action="erase">Erase</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
