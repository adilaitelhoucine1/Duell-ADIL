<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futoshiki Puzzle</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>Futoshiki <span class="subtitle">Unequal</span></h1>
            <div class="controls">
                <div class="control-group">
                    <label for="difficulty">Size:</label>
                    <select id="difficulty">
                        <option value="4">4x4 (Easy)</option>
                        <option value="5" selected>5x5 (Medium)</option>
                        <option value="6">6x6 (Hard)</option>
                    </select>
                </div>
                <button id="new-game-btn">New Game</button>
                <button id="check-btn">Check</button>
                <button id="solve-btn" class="secondary">Give Up</button>
            </div>
        </header>

        <main>
            <div class="game-area">
                <div id="grid-container" class="grid-container">
                    <!-- Grid generated by JS -->
                </div>
                <div id="message-area" class="message-area"></div>
            </div>

            <div class="rules-panel">
                <h3>How to Play</h3>
                <ul>
                    <li>Fill the grid with numbers 1 to <span id="max-num">5</span>.</li>
                    <li>Each row and column must contain unique numbers.</li>
                    <li>Follow the inequalities (<strong>&lt;</strong> or <strong>&gt;</strong>) between cells.</li>
                </ul>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
