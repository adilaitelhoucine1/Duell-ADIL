<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Killer Sudoku</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- PDF Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
    <div class="main-container">
        <header>
            <h1>Killer Sudoku</h1>
            <div class="controls">
                <button id="new-game-btn">New Game</button>
                <button id="check-btn">Check Solution</button>
                <button id="solve-btn" style="background-color: #ef5350;">Show Solution</button>
                <div class="control-group" style="margin-right: 15px;">
                    <label for="language">Language:</label>
                    <select id="language">
                        <option value="en">English</option>
                        <option value="de">Deutsch</option>
                        <option value="fr">Français</option>
                        <option value="it">Italiano</option>
                    </select>
                </div>
            </div>
            
            <!-- PDF Export Section -->
            <div class="pdf-controls">
                <h3>PDF Export</h3>
                <div class="control-group">
                    <label for="pdf-count">Number of Puzzles:</label>
                    <input type="number" id="pdf-count" value="5" min="1" max="50">
                    <label style="font-size: 0.9em; margin: 0 5px;"><input type="checkbox" id="pdf-hide-title" checked> Hide Title</label>
                    <button id="pdf-btn">Download PDF</button>
                </div>
                <div id="pdf-status" style="display:none; color: #1a73e8; font-weight: bold;">Generating... Please wait.</div>
            </div>
        </header>

        <div class="game-content">
            <div id="sudoku-grid" class="sudoku-grid">
                <!-- Generated by JS -->
            </div>

            <div class="numpad">
                <button class="num-btn" data-val="1">1</button>
                <button class="num-btn" data-val="2">2</button>
                <button class="num-btn" data-val="3">3</button>
                <button class="num-btn" data-val="4">4</button>
                <button class="num-btn" data-val="5">5</button>
                <button class="num-btn" data-val="6">6</button>
                <button class="num-btn" data-val="7">7</button>
                <button class="num-btn" data-val="8">8</button>
                <button class="num-btn" data-val="9">9</button>
                <button class="num-btn action-btn" data-action="erase">⌫</button>
            </div>
        </div>

        <div id="message-area" class="message-area"></div>
    </div>
    
    <!-- Hidden container for PDF generation -->
    <div id="pdf-export-bg" style="position: absolute; left: -9999px; top: 0;">
        <div id="pdf-export-container" class="pdf-export-container">
            <!-- Puzzles will be rendered here for capture -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
