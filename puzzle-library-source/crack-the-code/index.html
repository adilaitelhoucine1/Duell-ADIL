<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crack the Code</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
    <div class="game-container">
        <header>
            <h1>Crack the Code</h1>
            <div class="controls">
            <select id="language-select">
                <option value="en">English</option>
                <option value="de">Deutsch</option>
                <option value="fr">Français</option>
                <option value="it">Italiano</option>
            </select>
            <select id="difficulty">
                <option value="3">Easy (3 Digits)</option>
                    <option value="4" selected>Medium (4 Digits)</option>
                    <option value="5">Hard (5 Digits)</option>
                </select>
                <button id="new-game-btn">New Game</button>
                <button id="show-answer-btn">Show Answer</button>
            </div>
        </header>

        <main>
            <div class="clues-section">
                <h2>Clues</h2>
                <div id="clues-container" class="clues-list">
                    <!-- Clues will be generated here -->
                </div>
            </div>

            <div class="lock-interface">
                <div class="lock-body">
                    <div class="screen-area">
                        <div id="status-message" class="status-message">ENTER CODE</div>
                        <div id="guess-display" class="display">
                            <!-- Input slots will be generated here -->
                        </div>
                    </div>
                    
                    <div class="keypad">
                        <button class="key">1</button>
                        <button class="key">2</button>
                        <button class="key">3</button>
                        <button class="key">4</button>
                        <button class="key">5</button>
                        <button class="key">6</button>
                        <button class="key">7</button>
                        <button class="key">8</button>
                        <button class="key">9</button>
                        <button class="key" id="clear-btn">C</button>
                        <button class="key">0</button>
                        <button class="key" id="submit-btn">⮐</button>
                    </div>
                </div>
            </div>
            
            <div class="pdf-section">
                <h2>PDF Export</h2>
                <div class="pdf-controls">
                    <label for="pdf-count">Number of puzzles:</label>
                    <input type="number" id="pdf-count" value="5" min="1" max="20">
                    <button id="pdf-btn">Download PDF</button>
                </div>
            </div>
        </main>
    </div>
    
    <div id="pdf-export-container" style="position: absolute; left: -9999px; width: 600px; background: white; padding: 20px;"></div>
    
    <script src="script.js"></script>
</body>
</html>
